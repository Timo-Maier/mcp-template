_schema-version: '3.1'
ID: mcp-server-template
version: 1.0.0
description: MCP server template for SAP BTP
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - sh scripts/build-srv.sh

modules:
  - name: mcp-server-template
    type: nodejs
    path: gen/src
    parameters:
      memory: 256M
      health-check-type: http
      health-check-http-endpoint: /health
    properties:
      NODE_ENV: production
    requires:
      - name: mcp-xsuaa
      - name: mcp-destination
    provides:
      - name: mcp-server-template-app
        properties:
          app-url: ${default-url}

  - name: mcp-server-template-destination-content
    type: com.sap.application.content
    requires:
      - name: mcp-server-template-destination
        parameters:
          content-target: true
      - name: mcp-server-template-xsuaa
        parameters:
          service-key:
            name: mcp-server-template-xsuaa-key
      - name: mcp-server-template-app
    parameters:
      content:
        subaccount:
          destinations:
            - Name: mcp-server-template
              Description: MCP server — user token exchange destination for Warranty
              URL: ~{mcp-server-template-app/app-url}
              Authentication: OAuth2UserTokenExchange
              TokenServiceInstanceName: mcp-server-template-xsuaa
              TokenServiceKeyName: mcp-server-template-xsuaa-key
              HTML5.DynamicDestination: true
          existing_destinations_policy: update
    build-parameters:
      no-source: true

resources:
  - name: mcp-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  - name: mcp-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
